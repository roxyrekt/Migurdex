name: Build and Release

on:
    push:
        branches: [ "main" ]
        tags: [ "v*" ]
        paths-ignore: [ "**.md", "LICENSE" ]
    pull_request:
        branches: [ "main" ]
        paths-ignore: [ "**.md", "LICENSE" ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
    DOTNET_VERSION: "10.0.x"

jobs:
    build:
        name: Build (${{ matrix.runtime }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        runtime: linux-x64
                        native_lib: libmigurdex_native.so
                        cli_exe: migurdex
                    -   os: windows-latest
                        runtime: win-x64
                        native_lib: migurdex_native.dll
                        cli_exe: migurdex.exe

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Setup Rust
                uses: dtolnay/rust-toolchain@stable

            -   name: Build Rust Native
                working-directory: ./Migurdex.Native
                run: cargo build --release

            -   name: Publish API
                shell: bash
                run: |
                    dotnet publish Migurdex.Api/Migurdex.Api.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=true \
                      -p:PublishTrimmed=false \
                      -o dist/api

            -   name: Copy Native Library to API
                shell: bash
                run: |
                    cp Migurdex.Native/target/release/${{ matrix.native_lib }} dist/api/

            -   name: Publish CLI
                shell: bash
                run: |
                    dotnet publish Migurdex.Cli/Migurdex.Cli.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=true \
                      -p:PublishTrimmed=true \
                      -o dist/cli-temp

            -   name: Organize Dist
                shell: bash
                run: |
                    mv dist/cli-temp/${{ matrix.cli_exe }} dist/
                    rm -rf dist/cli-temp

            -   name: Publish Plugins
                shell: bash
                run: |
                    mkdir -p dist/api/Plugins
                    for d in Plugins/Migurdex.Plugins.*/; do
                      plugin=$(basename "$d")
                      [ -f "$d$plugin.csproj" ] || continue
                      echo "Publishing $plugin..."
                      dotnet publish "Plugins/$plugin/$plugin.csproj" \
                        -c Release \
                        -o dist/api/Plugins \
                        --no-self-contained
                    done

            -   name: Create Archive
                shell: bash
                run: |
                    cd dist
                    if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                      tar -czf ../migurdex-${{ matrix.runtime }}.tar.gz migurdex api
                    else
                      7z a -tzip ../migurdex-${{ matrix.runtime }}.zip migurdex.exe api
                    fi

            -   name: Download appimagetool
                if: matrix.os == 'ubuntu-latest'
                run: |
                    curl -sL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                    chmod +x appimagetool.AppImage

            -   name: Build AppImage
                if: matrix.os == 'ubuntu-latest'
                run: |
                    mkdir -p Migurdex.AppDir
                    cp dist/migurdex Migurdex.AppDir/
                    cp -r dist/api Migurdex.AppDir/
                    cp assets/packaging/migurdex.desktop assets/packaging/migurdex.png Migurdex.AppDir/
                    cp assets/packaging/migurdex.png Migurdex.AppDir/.DirIcon
                    ln -s migurdex Migurdex.AppDir/AppRun
                    chmod +x Migurdex.AppDir/migurdex
                    ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run Migurdex.AppDir migurdex-x86_64.AppImage

            -   name: Upload AppImage Artifact
                if: matrix.os == 'ubuntu-latest'
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-appimage
                    path: migurdex-x86_64.AppImage

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-${{ matrix.runtime }}
                    path: |
                        migurdex-${{ matrix.runtime }}.tar.gz
                        migurdex-${{ matrix.runtime }}.zip

    release:
        name: Create Release
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7

            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Flatten Artifacts
                run: |
                    mkdir release-files
                    find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release-files/ \;

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v3
                with:
                    files: release-files/*
                    generate_release_notes: true
                    draft: false
                    prerelease: ${{ contains(github.ref, '-') }}
