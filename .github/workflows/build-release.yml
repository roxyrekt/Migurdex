name: Build and Release

on:
    push:
        branches: [ "main" ]
        tags: [ "v*" ]
        paths-ignore: [ "**.md", "LICENSE" ]
    pull_request:
        branches: [ "main" ]
        paths-ignore: [ "**.md", "LICENSE" ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
    DOTNET_VERSION: "10.0.x"

jobs:
    build:
        name: Build (${{ matrix.runtime }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-22.04
                        runtime: linux-x64
                        native_lib: libmigurdex_native.so
                        cli_exe: migurdex
                        arch: x86_64
                    -   os: ubuntu-22.04-arm
                        runtime: linux-arm64
                        native_lib: libmigurdex_native.so
                        cli_exe: migurdex
                        arch: aarch64
                    -   os: windows-latest
                        runtime: win-x64
                        native_lib: migurdex_native.dll
                        cli_exe: migurdex.exe
                        arch: x64

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Setup Rust
                uses: dtolnay/rust-toolchain@stable

            -   name: Determine version
                shell: bash
                run: |
                    if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
                    else
                      echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
                    fi

            -   name: Build Rust Native
                working-directory: ./Migurdex.Native
                run: cargo build --release

            -   name: Publish API
                shell: bash
                run: |
                    dotnet publish Migurdex.Api/Migurdex.Api.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=true \
                      -p:PublishTrimmed=false \
                      -p:Version="$VERSION" \
                      -o dist/api

            -   name: Copy Native Library to API
                shell: bash
                run: |
                    cp Migurdex.Native/target/release/${{ matrix.native_lib }} dist/api/

            -   name: Publish CLI
                shell: bash
                run: |
                    dotnet publish Migurdex.Cli/Migurdex.Cli.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=true \
                      -p:PublishTrimmed=true \
                      -p:Version="$VERSION" \
                      -o dist/cli-temp

            -   name: Organize Dist
                shell: bash
                run: |
                    mv dist/cli-temp/${{ matrix.cli_exe }} dist/
                    rm -rf dist/cli-temp

            -   name: Publish Plugins
                shell: bash
                run: |
                    mkdir -p dist/api/Plugins
                    for d in Plugins/Migurdex.Plugins.*/; do
                      plugin=$(basename "$d")
                      [ -f "$d$plugin.csproj" ] || continue
                      echo "Publishing $plugin..."
                      dotnet publish "Plugins/$plugin/$plugin.csproj" \
                        -c Release \
                        -p:Version="$VERSION" \
                        -o dist/api/Plugins \
                        --no-self-contained
                    done

            -   name: Create Archive
                shell: bash
                run: |
                    cd dist
                    if [ "${{ matrix.os }}" != "windows-latest" ]; then
                      tar -czf ../migurdex-${{ matrix.runtime }}.tar.gz migurdex api
                    else
                      7z a -tzip ../migurdex-${{ matrix.runtime }}.zip migurdex.exe api
                    fi

            -   name: Download appimagetool
                if: matrix.os != 'windows-latest'
                run: |
                    curl -sL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
                    chmod +x appimagetool.AppImage

            -   name: Build AppImage
                if: matrix.os != 'windows-latest'
                run: |
                    mkdir -p Migurdex.AppDir
                    cp dist/migurdex Migurdex.AppDir/
                    cp -r dist/api Migurdex.AppDir/
                    cp assets/packaging/migurdex.desktop assets/packaging/migurdex.png Migurdex.AppDir/
                    cp assets/packaging/migurdex.png Migurdex.AppDir/.DirIcon
                    cp assets/packaging/AppRun Migurdex.AppDir/AppRun
                    chmod +x Migurdex.AppDir/AppRun Migurdex.AppDir/migurdex Migurdex.AppDir/api/Migurdex.Api
                    ARCH=${{ matrix.arch }} ./appimagetool.AppImage --appimage-extract-and-run -u "gh-releases-zsync|roxyrekt|Migurdex|latest|migurdex-${{ matrix.arch }}.AppImage.zsync" Migurdex.AppDir migurdex-${{ matrix.arch }}.AppImage

            -   name: Verify AppImage update info
                if: matrix.os != 'windows-latest'
                run: |
                    ./migurdex-${{ matrix.arch }}.AppImage --appimage-updateinformation | grep -q "gh-releases-zsync|roxyrekt|Migurdex"

            -   name: Generate checksums
                shell: bash
                run: |
                    if [ "${{ matrix.os }}" != "windows-latest" ]; then
                      (cd "$GITHUB_WORKSPACE" && sha256sum migurdex-${{ matrix.runtime }}.tar.gz > sha256sums-${{ matrix.runtime }}.txt)
                    else
                      (cd "$GITHUB_WORKSPACE" && sha256sum migurdex-${{ matrix.runtime }}.zip > sha256sums-${{ matrix.runtime }}.txt)
                    fi

            -   name: Upload AppImage Artifact
                if: matrix.os != 'windows-latest'
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-appimage-${{ matrix.arch }}
                    path: migurdex-${{ matrix.arch }}.AppImage*

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-${{ matrix.runtime }}
                    path: |
                        migurdex-${{ matrix.runtime }}.tar.gz
                        migurdex-${{ matrix.runtime }}.zip
                        sha256sums-${{ matrix.runtime }}.txt

    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        # NİÇİN KAPICI DEĞİL — bilinçli karar, keyfî görünmesin diye yazıldı.
        #
        # Tam süit ölçüldü: 12 koşunun 5'inde, 15 koşunun 3'inde **aralıklı** olarak
        # `DatabaseMigrationAndConcurrencyTests.TrackerMappings_And_SyncQueue_Roundtrip`
        # -> `SQLite Error 14: unable to open database file` ile kırılıyor.
        #
        # Ayırıcı ölçümler:
        #   • Bu sınıf TEK BAŞINA koşunca      0/12 başarısız
        #   • 6 SQLite sınıfı birlikte koşunca 0/10 başarısız
        #   • TÜM süit koşunca                 3/10 – 5/12 başarısız
        #   → sınıflar-arası ortak kaynak çakışması; kendi içinde yarış değil.
        #   • `%TEMP%`'deki 12.864 birikmiş dizin temizlendi, oran DEĞİŞMEDİ (3/15)
        #     → birikim neden değil.
        #   • `TestTempDirectory` olmadan (Group H öncesi hâl) de 3/12 kırılıyordu
        #     → **bu kırılganlık upstream'ten geliyor, bu PR'ın getirdiği bir hata değil.**
        #
        # Bu yüzden `dotnet test` KAPICI DEĞİL: ~%20 oranında kırmızı olan bir kapı,
        # kırmızı/yeşilin anlamını yok eder ve insanları CI'a güvenmemeye iter.
        # Sinyal görünür kalsın diye `continue-on-error` ile ekleniyor; kırılganlığın
        # kök nedeni ayrı bir iş olarak kaydedildi (bkz. test-reports/KNOWN-ISSUES.md).
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-22.04, windows-latest ]

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            # `build` işi yalnızca derliyor ve paketliyor; test **çalıştırmıyordu**.
            # Yeşil tik "derleniyor" demekti, "testler geçiyor" demek değildi — testler
            # kırılmış olsa bile PR yeşil kalıyordu.
            #
            # Bu iş Rust kurulumu gerektirmez: native kütüphaneyi yükleyen tek şey
            # `ExtractorFixture`, o da yalnız `ExtractorSmokeTests` tarafından
            # kullanılıyor ve aşağıda filtreleniyor. (Doğrulandı: native DLL test
            # çıktı klasöründe yokken 598 test geçiyor.)
            #
            # `ExtractorSmokeTests` ağ bağımlı canlı URL testleridir ve
            # non-deterministiktir (ölçülen: Windows 26-28/35, Linux 9/10-14/20 —
            # koşular arası toplam test sayısı bile değişiyor). Filtresiz
            # çalıştırılsaydı CI düzenli olarak kırılırdı; bu bir regresyon
            # göstergesi değil, ağ bağımlılığıdır.
            -   name: Test
                run: >
                    dotnet test Migurdex.Tests/Migurdex.Tests.csproj
                    -c Release
                    --filter "FullyQualifiedName!~ExtractorSmokeTests"

    release:
        name: Create Release
        # `test` bilinçli olarak listede **değil**: test işi `continue-on-error`
        # olduğu için listede olması anlamsız olurdu, ama "testler yeşil olmadan
        # yayımlama" gibi **yanlış bir güvence** de verirdi. Kırılganlığın kök nedeni
        # çözülene kadar kapıya bağlanmayacak.
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7

            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Flatten Artifacts
                run: |
                    mkdir release-files
                    find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.zsync" -o -name "*.txt" \) -exec cp {} release-files/ \;

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v3
                with:
                    files: release-files/*
                    generate_release_notes: true
                    draft: false
                    prerelease: ${{ contains(github.ref, '-') }}
