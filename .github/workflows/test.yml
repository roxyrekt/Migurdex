name: Unit Tests

on:
    workflow_call:

permissions:
    contents: read

env:
    DOTNET_VERSION: "10.0.x"
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
    unit:
        name: Unit tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-22.04, windows-latest ]

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}
                    cache: true
                    cache-dependency-path: "**/*.csproj"

            -   name: Build
                run: dotnet build Migurdex.slnx -c Release --nologo

            -   name: Verify formatting
                shell: bash
                run: |
                    dotnet format style Migurdex.slnx \
                      --verify-no-changes \
                      --no-restore \
                      --severity warn
                    dotnet format analyzers Migurdex.slnx \
                      --verify-no-changes \
                      --no-restore \
                      --severity warn

            -   name: Test
                shell: bash
                run: |
                    dotnet test --project Migurdex.Tests/Migurdex.Tests.csproj \
                      -c Release \
                      --no-build \
                      -- --filter-not-class "*ExtractorSmokeTests*"
