name: Release

on:
    push:
        tags: [ "v*" ]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    rust:
        name: Rust
        uses: ./.github/workflows/rust.yml

    test:
        name: Test
        uses: ./.github/workflows/test.yml

    package:
        name: Package
        needs: [ rust, test ]
        uses: ./.github/workflows/package.yml

    release:
        name: Create Release
        needs: package
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7

            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Flatten Artifacts
                run: |
                    mkdir release-files
                    find artifacts -type f \( -name "*.tar.gz" -o -name "*.delta.tar" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.zsync" \) -exec cp {} release-files/ \;
                    (cd release-files && sha256sum * > sha256sums.txt)
                    cat release-files/sha256sums.txt

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v3
                with:
                    files: release-files/*
                    generate_release_notes: true
                    draft: false
                    prerelease: ${{ contains(github.ref, '-') }}
