name: Extractor Smoke Tests

on:
    schedule:
        -   cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: smoke-${{ github.ref }}
    cancel-in-progress: true

env:
    DOTNET_VERSION: "10.0.x"
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
    smoke:
        name: Extractor smoke (ubuntu)
        runs-on: ubuntu-22.04
        continue-on-error: true

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}
                    cache: true
                    cache-dependency-path: "**/*.csproj"

            -   name: Setup Rust
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: Migurdex.Native -> target

            -   name: Build Rust Native (debug)
                working-directory: ./Migurdex.Native
                run: cargo build --locked

            -   name: Run extractor smoke tests
                run: |
                    dotnet test --project Migurdex.Tests/Migurdex.Tests.csproj \
                      -c Debug \
                      -- --filter-class "*ExtractorSmokeTests*"
