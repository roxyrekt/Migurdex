name: Package

on:
    workflow_call:

permissions:
    contents: read

env:
    DOTNET_VERSION: "10.0.x"
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
    build:
        name: Build (${{ matrix.runtime }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-22.04
                        runtime: linux-x64
                        native_lib: libmigurdex_native.so
                        cli_exe: migurdex
                        arch: x86_64
                    -   os: ubuntu-22.04-arm
                        runtime: linux-arm64
                        native_lib: libmigurdex_native.so
                        cli_exe: migurdex
                        arch: aarch64
                    -   os: windows-latest
                        runtime: win-x64
                        native_lib: migurdex_native.dll
                        cli_exe: migurdex.exe
                        arch: x64

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}
                    cache: true
                    cache-dependency-path: "**/*.csproj"

            -   name: Setup Rust
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: Migurdex.Native -> target

            -   name: Determine version
                shell: bash
                run: |
                    if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
                    else
                      echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
                    fi

            -   name: Restore
                shell: bash
                run: dotnet restore Migurdex.slnx -r ${{ matrix.runtime }}

            -   name: Build Rust Native
                working-directory: ./Migurdex.Native
                run: cargo build --release --locked


            -   name: Publish API
                shell: bash
                run: |
                    dotnet publish Migurdex.Api/Migurdex.Api.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=false \
                      -p:PublishTrimmed=false \
                      -p:Version="$VERSION" \
                      --no-restore \
                      -o dist/api

            -   name: Copy Native Library to API
                shell: bash
                run: |
                    cp Migurdex.Native/target/release/${{ matrix.native_lib }} dist/api/

            -   name: Publish CLI
                shell: bash
                run: |
                    if [ "${{ matrix.os }}" = "windows-latest" ]; then
                      OUT=dist
                    else
                      OUT=dist/cli
                    fi
                    dotnet publish Migurdex.Cli/Migurdex.Cli.csproj \
                      -c Release \
                      -r ${{ matrix.runtime }} \
                      --self-contained true \
                      -p:PublishSingleFile=false \
                      -p:PublishTrimmed=false \
                      -p:Version="$VERSION" \
                      --no-restore \
                      -o "$OUT"

            -   name: Dedupe Shared Runtime
                shell: bash
                run: |
                    if [ "${{ matrix.os }}" = "windows-latest" ]; then
                      SRC=dist
                      DEPTH="-maxdepth 1"
                    else
                      SRC=dist/cli
                      DEPTH=""
                    fi

                    linked=0; saved=0
                    while IFS= read -r -d '' f; do
                      rel="${f#$SRC/}"
                      dst="dist/api/$rel"
                      [ -f "$dst" ] || continue
                      [ "$(stat -c %s "$f")" = "$(stat -c %s "$dst")" ] || continue
                      [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$(sha256sum "$dst" | cut -d' ' -f1)" ] || continue
                      size=$(stat -c %s "$f")
                      if ln "$dst" "$f.hltmp" 2>/dev/null; then
                        mv -f "$f.hltmp" "$f" 2>/dev/null
                        rm -f "$f.hltmp" 2>/dev/null
                        linked=$((linked+1)); saved=$((saved+size))
                      else
                        rm -f "$f.hltmp"
                      fi
                    done < <(find "$SRC" $DEPTH -type f -print0)

                    if [ "${{ matrix.os }}" != "windows-latest" ]; then
                      cp assets/packaging/migurdex-launcher.sh dist/migurdex
                      chmod +x dist/migurdex
                    fi
                    echo "hardlink: $linked dosya, $((saved/1024/1024)) MB tasarruf"
                    echo "payload: $(du -sh --apparent-size dist | cut -f1) gorunur, $(du -sh dist | cut -f1) diskte"

            -   name: Publish Plugins
                shell: bash
                run: |
                    mkdir -p dist/api/Plugins
                    for d in Plugins/Migurdex.Plugins.*/; do
                      plugin=$(basename "$d")
                      [ -f "$d$plugin.csproj" ] || continue
                      dotnet publish "Plugins/$plugin/$plugin.csproj" \
                        -c Release \
                        -p:Version="$VERSION" \
                        --no-restore \
                        -o dist/api/Plugins \
                        --no-self-contained
                    done

            -   name: Create Archive
                shell: bash
                run: |
                    EXCLUDES='--exclude=*.tar.gz --exclude=*.delta.tar --exclude=*.zip'
                    tar -czf "migurdex-${{ matrix.runtime }}.tar.gz" -C dist $EXCLUDES .
                    echo "gz: $(du -h migurdex-${{ matrix.runtime }}.tar.gz | cut -f1)"
                    echo "hardlink: $(tar -tvzf migurdex-${{ matrix.runtime }}.tar.gz | grep -c '^h')"

                    if [ "${{ matrix.os }}" = "windows-latest" ]; then
                      (cd dist && 7z a -tzip "../migurdex-${{ matrix.runtime }}.zip" \
                        -x'!*.tar.gz' -x'!*.delta.tar' -x'!*.zip' \
                        * >/dev/null)
                      echo "zip: $(du -h migurdex-${{ matrix.runtime }}.zip | cut -f1)"
                    fi

            -   name: Build delta blob store
                shell: bash
                run: |
                    python3 assets/packaging/build-blobs.py \
                      --input dist \
                      --output-dir . \
                      --runtime ${{ matrix.runtime }} \
                      --exclude '*.tar.gz' \
                      --exclude '*.delta.tar' \
                      --exclude '*.zip'

            -   name: Download appimagetool
                if: matrix.os != 'windows-latest'
                run: |
                    curl -fsSL --retry 3 --retry-delay 2 \
                      -o appimagetool.AppImage \
                      https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
                    chmod +x appimagetool.AppImage

            -   name: Build AppImage
                if: matrix.os != 'windows-latest'
                run: |
                    mkdir -p Migurdex.AppDir
                    cp -a dist/cli dist/api Migurdex.AppDir/
                    cp -a assets/packaging/migurdex.desktop assets/packaging/migurdex.png Migurdex.AppDir/
                    cp assets/packaging/migurdex.png Migurdex.AppDir/.DirIcon
                    cp assets/packaging/AppRun Migurdex.AppDir/AppRun
                    cp assets/packaging/migurdex-launcher.sh Migurdex.AppDir/migurdex
                    chmod -R a+rX Migurdex.AppDir
                    chmod a+rx Migurdex.AppDir/migurdex
                    chmod a+rx Migurdex.AppDir/AppRun
                    chmod +x Migurdex.AppDir/cli/migurdex Migurdex.AppDir/api/Migurdex.Api
                    ARCH=${{ matrix.arch }} ./appimagetool.AppImage --appimage-extract-and-run -u "gh-releases-zsync|roxyrekt|Migurdex|latest|migurdex-${{ matrix.arch }}.AppImage.zsync" Migurdex.AppDir migurdex-${{ matrix.arch }}.AppImage

            -   name: Verify AppImage update info
                if: matrix.os != 'windows-latest'
                run: |
                    ./migurdex-${{ matrix.arch }}.AppImage --appimage-updateinformation | grep -q "gh-releases-zsync|roxyrekt|Migurdex"

            -   name: Upload AppImage Artifact
                if: matrix.os != 'windows-latest'
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-appimage-${{ matrix.arch }}
                    path: migurdex-${{ matrix.arch }}.AppImage*
                    if-no-files-found: error
                    retention-days: 1

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: migurdex-${{ matrix.runtime }}
                    path: |
                        migurdex-${{ matrix.runtime }}.tar.gz
                        migurdex-${{ matrix.runtime }}.delta.tar
                        migurdex-${{ matrix.runtime }}.zip
                    retention-days: 1
                    if-no-files-found: error
