version: 2
updates:
    -   package-ecosystem: "nuget"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
        open-pull-requests-limit: 5
        groups:
            microsoft-extensions:
                patterns: [ "Microsoft.Extensions.*" ]
            test-stack:
                patterns: [ "xunit*", "Microsoft.NET.Test.Sdk" ]
            serilog:
                patterns: [ "Serilog*" ]

    -   package-ecosystem: "cargo"
        directory: "/Migurdex.Native"
        schedule:
            interval: "weekly"
            day: "monday"
        open-pull-requests-limit: 5
        groups:
            tokio-stack:
                patterns: [ "tokio*", "futures*" ]
            serde-stack:
                patterns: [ "serde*" ]

    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "weekly"
            day: "monday"
        open-pull-requests-limit: 5
        groups:
            actions:
                patterns: [ "*" ]
