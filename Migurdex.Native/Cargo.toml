[package]
name = "migurdex_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dashmap = "6.0"
url = "2.5"
tokio = { version = "1", features = ["full"] }
wreq = { version = "6.0.0-rc", features = ["json", "cookies", "gzip"] }
wreq-util = { version = "3.0.0-rc", features = ["emulation-serde"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
regex = "1.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

